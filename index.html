<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐻 XP Bear Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Анимированный фон -->
    <div class="space-background">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
        <div class="comets"></div>
    </div>

    <div class="app">
        <!-- Главный экран -->
        <div class="screen active" id="screen-main">
            <div class="header-glass">
                <div class="balance-section">
                    <div class="balance-label"> Твой баланс XP</div>
                    <div class="balance-value">
                        <span id="xp-balance">0</span>
                    </div>
                    <div class="xp-per-tap">⚡ +<span id="xp-per-tap">1</span> XP за тап</div>
                </div>
            </div>

            <div class="bear-section">
                <div class="bear-wrapper">
                    <div class="bear-glow"></div>
                    <div class="bear" id="bear">
                        <div class="bear-body">
                            <div class="bear-ear left"></div>
                            <div class="bear-ear right"></div>
                            <div class="bear-head">
                                <div class="bear-face">
                                    <div class="bear-eye left"></div>
                                    <div class="bear-eye right"></div>
                                    <div class="bear-nose"></div>
                                    <div class="bear-mouth"></div>
                                </div>
                            </div>
                            <div class="bear-torso"></div>
                            <div class="bear-paw left"></div>
                            <div class="bear-paw right"></div>
                        </div>
                    </div>
                </div>
                <div class="tap-instruction">👆 ТАПАЙ ПО МИШКЕ!</div>
            </div>

            <div class="energy-section">
                <div class="energy-label">⚡ Энергия</div>
                <div class="energy-bar-container">
                    <div class="energy-bar">
                        <div class="energy-fill" id="energy-fill"></div>
                    </div>
                </div>
                <div class="energy-text">
                    <span id="energy-current">1000</span> / <span id="energy-max">1000</span>
                </div>
            </div>
        </div>

        <!-- Экран профиля -->
        <div class="screen" id="screen-profile">
            <div class="profile-glass">
                <div class="profile-header">
                    <div class="profile-avatar" id="profile-avatar">👤</div>
                    <div class="profile-info">
                        <div class="profile-name" id="profile-name">Загрузка...</div>
                        <div class="profile-level">⭐ Уровень <span id="profile-level">1</span></div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"></div>
                        <div class="stat-value" id="stat-wins">0</div>
                        <div class="stat-label">Побед</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⚡</div>
                        <div class="stat-value" id="stat-xp">0</div>
                        <div class="stat-label">Всего XP</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"></div>
                        <div class="stat-value" id="stat-refs">0</div>
                        <div class="stat-label">Рефералов</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">👆</div>
                        <div class="stat-value" id="stat-clicks">0</div>
                        <div class="stat-label">Кликов</div>
                    </div>
                </div>
            </div>

            <div class="section-glass">
                <div class="section-title">🏅 Топ по XP</div>
                <div class="top-list" id="top-xp-list">
                    <div class="loading-item"> Загрузка...</div>
                </div>
            </div>

            <div class="section-glass">
                <div class="section-title">🎯 Топ победителей</div>
                <div class="top-list" id="top-wins-list">
                    <div class="loading-item">⏳ Загрузка...</div>
                </div>
            </div>

            <div class="section-glass">
                <div class="section-title">🔗 Реферальная система</div>
                <div class="referral-box">
                    <div class="referral-text">Пригласи друга и получи <b>+50 XP</b>!</div>
                    <button class="referral-btn" id="referral-btn">📋 Скопировать ссылку</button>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <button class="nav-btn active" data-screen="main">
                <div class="nav-icon">🐻</div>
                <div class="nav-label">Главная</div>
            </button>
            <button class="nav-btn" data-screen="profile">
                <div class="nav-icon">👤</div>
                <div class="nav-label">Профиль</div>
            </button>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
